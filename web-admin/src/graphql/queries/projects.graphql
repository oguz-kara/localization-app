query GetProjects {
  projects {
    id
    name
    description
    slug
    isActive
    channelToken
    createdAt
    updatedAt
  }
}

query GetProject($id: String!) {
  project(id: $id) {
    id
    name
    description
    slug
    isActive
    channelToken
    createdAt
    updatedAt
  }
}

query GetProjectTranslations($projectId: String!) {
  translationKeys(projectId: $projectId) {
    id
    key
    description
    context
    isActive
    projectId
    createdAt
    updatedAt
  }
}

query GetTranslations($projectId: String!, $language: String!) {
  getTranslations(projectId: $projectId, language: $language) {
    language
    projectId
    totalKeys
    translatedKeys
    translations
  }
}

query GetUser($id: String!) {
  getUser(id: $id) {
    id
    name
    email
    createdAt
    updatedAt
  }
}

query Me {
  me {
    id
    name
    email
    createdAt
    updatedAt
  }
}